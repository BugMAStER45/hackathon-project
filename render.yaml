# ──────────────────────────────────────────────────────────────────────────────
# Render Blueprint — FortyGuard HeatShield
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend: FastAPI (Native Python — no Docker, free tier friendly) ─────────
  - type: web
    name: heatshield-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FORTYGUARD_API_KEY
        value: 25f1c4497921abc012e72a398543f140
      - key: FORTYGUARD_API_BASE_URL
        value: https://api.fortyguard.com/v1
      - key: MONGODB_URL
        sync: false
      - key: DB_NAME
        value: heatshield_california
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Frontend: React Static Site (always free, no plan field needed) ──────────
  - type: web
    name: heatshield-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://heatshield-api.onrender.com

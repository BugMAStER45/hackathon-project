# ──────────────────────────────────────────────────────────────────────────────
# Render Blueprint — FortyGuard HeatShield
# Deploys: FastAPI backend + MongoDB (via Atlas, external)
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend: FastAPI ────────────────────────────────────────────────────────
  - type: web
    name: heatshield-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FORTYGUARD_API_KEY
        value: 25f1c4497921abc012e72a398543f140
      - key: FORTYGUARD_API_BASE_URL
        value: https://api.fortyguard.com/v1
      - key: MONGODB_URL
        sync: false   # Will be set manually in Render dashboard (MongoDB Atlas URL)
      - key: DB_NAME
        value: heatshield_california
      - key: PORT
        value: "8000"

  # ── Frontend: React (Static Site) ─────────────────────────────────────────
  - type: web
    name: heatshield-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: ./frontend
    plan: free
    routes:
      - type: rewrite
        source: /api/*
        destination: https://heatshield-api.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    envVars:
      - key: VITE_API_URL
        value: https://heatshield-api.onrender.com
